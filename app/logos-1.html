<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralbase · Mark Study 01</title>
<meta name="description" content="Ten letterform marks for Neuralbase. Monochrome, built to read small.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
/* ---------- Neuralbase mark study 01: monogram proof sheet ---------- */
body{overflow-x:clip}
.mk-page{max-width:1120px;margin:0 auto;padding:30px 20px 44px}
.mk-head{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.mk-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mk-title{margin:0;font-size:clamp(24px,3.6vw,34px);font-weight:600;letter-spacing:-.02em}
.mk-sub{margin:0;color:var(--muted);font-size:13.5px;max-width:54ch;line-height:1.5}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.mk-tile{
  position:relative;min-width:0;min-height:198px;margin:0;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px 13px;display:flex;flex-direction:column;gap:10px;
}
.mk-idx{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim)}
.mk-mark{flex:1;display:grid;place-items:center;min-height:0;color:var(--accent)}
.mk-mark svg{width:96px;height:96px;display:block;max-width:100%}
.mk-cap{font-size:12.5px;color:var(--muted);text-align:center}
.mk-foot{
  margin-top:24px;padding-top:14px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
}
@media (max-width:420px){
  .mk-page{padding:20px 14px 32px}
  .mk-grid{gap:10px}
  .mk-tile{min-height:180px;padding:12px}
  .mk-mark svg{width:80px;height:80px}
}
</style>
</head>
<body>
<div class="mk-page">

  <header class="mk-head">
    <p class="mk-eyebrow">Neuralbase · Mark study 01</p>
    <h1 class="mk-title">Monogram family</h1>
    <p class="mk-sub">Ten letterform marks built from the letters N and B. Monochrome, drawn to stay legible at small sizes.</p>
  </header>

  <div class="mk-grid">

    <figure class="mk-tile">
      <span class="mk-idx">01</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <rect x="13" y="11" width="10" height="42"/>
          <rect x="41" y="11" width="10" height="42"/>
          <path d="M13 11h10l28 42H41z"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Bold N</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">02</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 48V16l14 32V16"/>
          <path d="M35 48V16m0 0h8.5a7.5 7.5 0 0 1 0 15H35m0 1h9.5a7.5 7.5 0 0 1 0 15H35"/>
        </svg>
      </div>
      <figcaption class="mk-cap">NB monogram</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">03</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <rect x="7" y="7" width="8" height="8"/>
          <rect x="7" y="17" width="8" height="8"/>
          <rect x="7" y="27" width="8" height="8"/>
          <rect x="7" y="37" width="8" height="8"/>
          <rect x="7" y="47" width="8" height="8"/>
          <rect x="47" y="7" width="8" height="8"/>
          <rect x="47" y="17" width="8" height="8"/>
          <rect x="47" y="27" width="8" height="8"/>
          <rect x="47" y="37" width="8" height="8"/>
          <rect x="47" y="47" width="8" height="8"/>
          <rect x="17" y="17" width="8" height="8"/>
          <rect x="27" y="27" width="8" height="8"/>
          <rect x="37" y="37" width="8" height="8"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Grid N</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">04</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="currentColor">
            <rect x="11" y="9" width="12" height="46"/>
            <rect x="41" y="9" width="12" height="46"/>
          </g>
          <g stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
            <path d="M32 32 17 14M32 32 47 50M32 32 30 16M32 32 44 22"/>
          </g>
          <circle cx="32" cy="32" r="7.5" fill="currentColor"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Neuron N</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">05</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 46V28a9 9 0 0 1 18 0V46"/>
          <path d="M40 14V46m0-16a8 8 0 0 1 0 16"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Lowercase nb</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">06</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <rect x="20" y="10" width="5" height="20"/>
          <rect x="39" y="10" width="5" height="20"/>
          <path d="M20 10h5l19 20h-5z"/>
          <rect x="23" y="34" width="5" height="22"/>
          <path d="M28 34h8a8 8 0 0 1 0 11H28z"/>
          <path d="M28 45h9a8 8 0 0 1 0 11H28z"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Stacked NB</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">07</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <rect x="11" y="15" width="17" height="5"/>
          <rect x="11" y="44" width="17" height="5"/>
          <rect x="36" y="15" width="17" height="5"/>
          <rect x="36" y="44" width="17" height="5"/>
          <rect x="16" y="15" width="8" height="34"/>
          <rect x="40" y="15" width="8" height="34"/>
          <path d="M16 15h8l24 34h-8z"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Slab N</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">08</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="3.5"/>
          <g fill="currentColor">
            <rect x="22" y="21" width="5.5" height="22"/>
            <rect x="36.5" y="21" width="5.5" height="22"/>
            <path d="M22 21h5.5l14.5 22h-5.5z"/>
          </g>
        </svg>
      </div>
      <figcaption class="mk-cap">Roundel N</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">09</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <g id="mkN"><rect x="9" y="9" width="13" height="46"/><rect x="42" y="9" width="13" height="46"/><path d="M9 9h13l33 46H42z"/></g>
            <mask id="mk9"><rect width="64" height="64" fill="#fff"/><use href="#mkN" fill="#000" transform="translate(32 32) scale(.78) translate(-32 -32)"/></mask>
          </defs>
          <use href="#mkN" fill="currentColor" mask="url(#mk9)"/>
          <use href="#mkN" fill="currentColor" transform="translate(32 32) scale(.54) translate(-32 -32)"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Nested N</figcaption>
    </figure>

    <figure class="mk-tile">
      <span class="mk-idx">10</span>
      <div class="mk-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <mask id="mk10">
            <rect width="64" height="64" fill="#fff"/>
            <g fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 44V20l10 24V20"/>
              <path d="M35 44V20m0 0h5.5a6 6 0 0 1 0 12H35m0 1h6.5a5.5 5.5 0 0 1 0 11H35"/>
            </g>
          </mask>
          <rect x="7" y="7" width="50" height="50" rx="12" fill="currentColor" mask="url(#mk10)"/>
        </svg>
      </div>
      <figcaption class="mk-cap">Badge NB</figcaption>
    </figure>

  </div>

  <p class="mk-foot">10 marks · monogram family · accent = lime token</p>

</div>
</body>
</html>
