<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralbase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="focus.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script type="importmap">
{ "imports": { "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" } }
</script>
<style>
/* ---------- App shell chrome (v2). Uses the AS-03 token base in styles.css. ---------- */
.rail{align-items:stretch;overflow-y:auto}
.rail-head{display:flex;align-items:center;justify-content:center;gap:var(--gap-1);width:100%;margin-bottom:var(--gap-2)}
.rail-mark{background:none;border:0;padding:0;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
.rail-mark:hover{background:var(--lime-soft)}
.rail-close{display:none;align-items:center;justify-content:center;width:28px;height:28px;flex:none;padding:0;background:transparent;border:1px solid transparent;border-radius:var(--r);color:var(--muted);transition:background .15s ease,color .15s ease,border-color .15s ease}
.rail-close:hover{background:var(--hover);color:var(--ink);border-color:var(--line)}
.rail-close svg{width:18px;height:18px;display:block}
body.rail-open .rail-head{justify-content:space-between}
body.rail-open .rail-close{display:flex}
.tb-reopen{display:none;align-items:center;justify-content:center;width:32px;height:32px;flex:none;padding:0;background:transparent;border:1px solid transparent;border-radius:var(--r);color:var(--muted);transition:background .15s ease,color .15s ease,border-color .15s ease}
.tb-reopen:hover{background:var(--hover);color:var(--ink);border-color:var(--line)}
.tb-reopen svg{width:20px;height:20px;display:block}
body.rail-closed .tb-reopen{display:inline-flex}
.rail-top{width:100%;display:flex;flex-direction:column;gap:var(--gap-1)}
.rail-nav{display:flex;flex-direction:column;gap:var(--gap-1);width:100%}
.rail-divider{height:1px;background:var(--line);margin:var(--gap-3) 2px var(--gap-2);flex:none}
.account{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid transparent;border-radius:9px;padding:6px;color:var(--ink);text-align:left}
.account:hover{background:var(--hover);border-color:var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-family:var(--mono);font-size:13px;color:var(--ink);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.account-meta{display:none;flex-direction:column;gap:1px;min-width:0;flex:1}
.account-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-plan{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.account-chev{display:none;color:var(--dim);flex:none}
body.rail-open .account-meta{display:flex}
body.rail-open .account-chev{display:block}
.tb-mark{display:none;width:26px;height:26px;flex:none;color:var(--lime)}
.tb-mark svg{width:100%;height:100%;display:block}
.account-mobile{display:none;align-items:center;background:transparent;border:1px solid transparent;border-radius:9px;padding:2px;color:var(--ink)}
.account-mobile .avatar{width:32px;height:32px}
.tb-titles{display:flex;flex-direction:column;gap:1px;min-width:0}
.tb-titles .brand,.tb-titles .view-sub{line-height:1.25}
/* An empty subtitle is not rendered, so Settings does not carry a blank line
   under the title that reads as a missing value. */
#tbSub:empty{display:none}
.account-menu{position:fixed;z-index:70;min-width:200px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column;gap:2px}
.account-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:9px 10px;font-size:13px;color:var(--ink)}
.account-menu button:hover{background:var(--hover)}
.account-menu .menu-sep{height:1px;background:var(--line);margin:4px 2px}
.demo-banner{display:flex;align-items:center;justify-content:center;gap:var(--gap-2);background:var(--lime-soft);border-bottom:1px solid var(--lime-edge);color:var(--ink);font-size:12.5px;padding:var(--gap-2) var(--gap-4);text-align:center}
.demo-banner b{font-weight:600}
.tabbar{display:none}
.tab{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;padding:6px 2px;border-radius:8px}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{color:var(--lime)}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;background:var(--scrim)}
.sheet-card{width:100%;background:var(--panel);border-top:1px solid var(--line2);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
.sheet-card h2{margin:0 0 8px;font-size:15px;font-weight:600}
.sheet-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:12px 10px;font-size:14px;color:var(--ink)}
.sheet-item:hover{background:var(--hover)}
.sheet-sep{height:1px;background:var(--line);margin:6px 2px}
.sheet-close{color:var(--muted);justify-content:center}
.view-note{color:var(--muted);font-size:13.5px}
@media (max-width:820px){
  .rail{display:none}
  main,body.rail-open main,body.rail-closed main{margin-left:0}
  .rail-close,.tb-reopen{display:none!important}
  .account-mobile{display:flex}
  .tb-mark{display:flex;align-items:center;justify-content:center}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .content{padding:var(--gap-4) var(--gap-4) 92px}
}
@media (max-width:560px){.content{padding:var(--gap-3) var(--gap-4) 92px}}
</style>
</head>
<body>

<script>
  /* Pre-paint shell state: the stored rail preference and the wide default are set
     before the first paint, so the drawer never slides in on load and there is no
     layout shift. nav.js re-applies the same state, which is then a no-op. */
  (function () {
    var b = document.body;
    var closed = false;
    try { closed = localStorage.getItem('cortex.rail.closed') === '1'; } catch (e) {}
    if (closed) b.classList.add('rail-closed');
    else if (window.innerWidth >= 1100) b.classList.add('rail-open');
  })();
</script>

<aside class="rail" id="rail" aria-label="Primary">
  <div class="rail-top">
    <div class="rail-head">
      <button class="rail-mark" id="railMark" type="button" aria-label="Go to dashboard">
        <svg viewBox="0 0 64 64" width="26" height="26" fill="currentColor" aria-hidden="true">
          <rect x="8" y="8" width="8" height="8"/><rect x="8" y="18" width="8" height="8"/><rect x="8" y="28" width="8" height="8"/><rect x="8" y="38" width="8" height="8"/><rect x="8" y="48" width="8" height="8"/>
          <rect x="48" y="8" width="8" height="8"/><rect x="48" y="18" width="8" height="8"/><rect x="48" y="28" width="8" height="8"/><rect x="48" y="38" width="8" height="8"/><rect x="48" y="48" width="8" height="8"/>
          <rect x="18" y="18" width="8" height="8"/><rect x="28" y="28" width="8" height="8"/><rect x="38" y="38" width="8" height="8"/>
        </svg>
      </button>
      <button class="rail-close" id="railClose" type="button" aria-label="Hide navigation" aria-controls="rail" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6"></path></svg>
      </button>
    </div>
    <button class="account" id="accountBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
      <span class="avatar" id="avatarRail">A</span>
      <span class="account-meta">
        <span class="account-name" id="accountName">Account</span>
        <span class="account-plan mono" id="accountPlan">Free</span>
      </span>
      <span class="account-chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </span>
    </button>

    <div class="rail-divider" aria-hidden="true"></div>

    <nav class="rail-nav" aria-label="Primary">
      <button class="navbtn" type="button" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v9h12v-9"></path><path d="M10 19v-5h4v5"></path></svg>
        <span class="rail-label">Dashboard</span>
      </button>
      <button class="navbtn" type="button" data-view="train">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l4 0M17 13l4 0M13 3l0 4M13 17l0 4"></path><circle cx="12" cy="12" r="5.2"></circle></svg>
        <span class="rail-label">Train</span>
      </button>
      <button class="navbtn" type="button" data-view="circuit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h5l6 10h5"></path><path d="M4 17h5l2-3"></path><path d="M17 4l3 3-3 3"></path><path d="M17 14l3 3-3 3"></path></svg>
        <span class="rail-label">Circuit</span>
      </button>
      <button class="navbtn" type="button" data-view="study">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h6a2.5 2.5 0 0 1 2 2.5v11a2 2 0 0 0-2-1.5H4z"></path><path d="M20 5.5h-6a2.5 2.5 0 0 0-2 2.5v11a2 2 0 0 1 2-1.5h6z"></path></svg>
        <span class="rail-label">Study</span>
      </button>
      <button class="navbtn" type="button" data-view="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 9-9"></path><path d="M16 7h5v5"></path></svg>
        <span class="rail-label">Progress</span>
      </button>
      <button class="navbtn" type="button" data-view="leaderboards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"></path><path d="M7 20v-6h3v6"></path><path d="M11 20V7h3v13"></path><path d="M15 20v-9h3v9"></path></svg>
        <span class="rail-label">Leaderboards</span>
      </button>
    </nav>
  </div>

  <span class="rail-spacer" aria-hidden="true"></span>

  <div class="rail-divider" aria-hidden="true"></div>

  <button class="navbtn" type="button" data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    <span class="rail-label">Settings</span>
  </button>
</aside>

<main>
  <div class="demo-banner" id="demoBanner" hidden>
    <b>Demo mode.</b> No backend keys, so progress stays on this device.
  </div>

  <header class="topbar">
    <div class="tb-left">
      <button class="tb-reopen" id="railReopen" type="button" aria-label="Show navigation" aria-controls="rail" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M9 4v16"></path><path d="M13.5 9l3 3-3 3"></path></svg>
      </button>
      <button class="tb-mark" id="tbMark" type="button" aria-label="Go to dashboard">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <rect x="8" y="8" width="8" height="8"/><rect x="8" y="18" width="8" height="8"/><rect x="8" y="28" width="8" height="8"/><rect x="8" y="38" width="8" height="8"/><rect x="8" y="48" width="8" height="8"/>
          <rect x="48" y="8" width="8" height="8"/><rect x="48" y="18" width="8" height="8"/><rect x="48" y="28" width="8" height="8"/><rect x="48" y="38" width="8" height="8"/><rect x="48" y="48" width="8" height="8"/>
          <rect x="18" y="18" width="8" height="8"/><rect x="28" y="28" width="8" height="8"/><rect x="38" y="38" width="8" height="8"/>
        </svg>
      </button>
      <button class="account-mobile" id="accountMobile" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu" aria-label="Account">
        <span class="avatar" id="avatarMobile">A</span>
      </button>
      <div class="tb-titles">
        <h1 class="brand" id="tbTitle">Neuralbase</h1>
        <p class="view-sub" id="tbSub"></p>
      </div>
    </div>
    <div class="tb-right">
    </div>
  </header>

  <div class="content" id="view-root">
    <section class="view" id="view-dashboard" tabindex="-1" aria-label="Dashboard" hidden></section>
    <section class="view" id="view-onboarding" tabindex="-1" aria-label="Welcome" hidden></section>
    <section class="view" id="view-train" tabindex="-1" aria-label="Train" hidden></section>
    <section class="view" id="view-study" tabindex="-1" aria-label="Study" hidden></section>
    <section class="view" id="view-circuit" tabindex="-1" aria-label="Circuit" hidden></section>
    <section class="view" id="view-progress" tabindex="-1" aria-label="Progress" hidden></section>
    <section class="view" id="view-leaderboards" tabindex="-1" aria-label="Leaderboards" hidden></section>
    <section class="view" id="view-profile" tabindex="-1" aria-label="Profile" hidden></section>
    <section class="view" id="view-settings" tabindex="-1" aria-label="Settings" hidden></section>
  </div>
</main>

<nav class="tabbar" id="tabbar" aria-label="Primary">
  <button class="tab" type="button" data-view="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v9h12v-9"></path><path d="M10 19v-5h4v5"></path></svg>
    <span>Dashboard</span>
  </button>
  <button class="tab" type="button" data-view="train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l4 0M17 13l4 0M13 3l0 4M13 17l0 4"></path><circle cx="12" cy="12" r="5.2"></circle></svg>
    <span>Train</span>
  </button>
  <button class="tab" type="button" data-view="circuit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h5l6 10h5"></path><path d="M4 17h5l2-3"></path><path d="M17 4l3 3-3 3"></path><path d="M17 14l3 3-3 3"></path></svg>
    <span>Circuit</span>
  </button>
  <button class="tab" type="button" data-view="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 9-9"></path><path d="M16 7h5v5"></path></svg>
    <span>Progress</span>
  </button>
  <button class="tab" type="button" id="moreTab" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>
    <span>More</span>
  </button>
</nav>

<div class="sheet" id="moreSheet" hidden role="dialog" aria-modal="true" aria-label="More">
  <div class="sheet-card">
    <h2>More</h2>
    <button class="sheet-item" type="button" data-view="study">Study</button>
    <button class="sheet-item" type="button" data-view="leaderboards">Leaderboards</button>
    <button class="sheet-item" type="button" data-view="settings">Settings</button>
    <div class="sheet-sep" aria-hidden="true"></div>
    <button class="sheet-item" type="button" id="sheetSignOut">Sign out</button>
    <button class="sheet-item sheet-close" type="button" id="sheetClose">Close</button>
  </div>
</div>

<div class="sr" id="live" aria-live="polite"></div>

<!-- Boot and view-change loader. Cells light in sequence; a static frame under reduced motion. -->
<div class="nb-loader" id="nbLoader" aria-hidden="true">
  <svg viewBox="0 0 64 64" fill="currentColor">
    <rect class="nb-c" style="--i:0" x="7" y="7" width="8" height="8"/>
    <rect class="nb-c" style="--i:1" x="47" y="7" width="8" height="8"/>
    <rect class="nb-c" style="--i:2" x="7" y="17" width="8" height="8"/>
    <rect class="nb-c" style="--i:3" x="17" y="17" width="8" height="8"/>
    <rect class="nb-c" style="--i:4" x="47" y="17" width="8" height="8"/>
    <rect class="nb-c" style="--i:5" x="7" y="27" width="8" height="8"/>
    <rect class="nb-c" style="--i:6" x="27" y="27" width="8" height="8"/>
    <rect class="nb-c" style="--i:7" x="47" y="27" width="8" height="8"/>
    <rect class="nb-c" style="--i:8" x="7" y="37" width="8" height="8"/>
    <rect class="nb-c" style="--i:9" x="37" y="37" width="8" height="8"/>
    <rect class="nb-c" style="--i:10" x="47" y="37" width="8" height="8"/>
    <rect class="nb-c" style="--i:11" x="7" y="47" width="8" height="8"/>
    <rect class="nb-c" style="--i:12" x="47" y="47" width="8" height="8"/>
  </svg>
</div>
<script>
  /* Failsafe: if the app modules never boot, never leave the loader covering the shell. */
  setTimeout(function () {
    var l = document.getElementById('nbLoader');
    if (l && !l.hidden) l.hidden = true;
  }, 5000);
</script>

<script>
  /* View modules that exist in app/views/. The router imports only names listed here, so a
     view that is not built yet renders a placeholder instead of a failed network request.
     Add a name as its module lands, e.g. ["dashboard","train","circuit"]. */
  window.CORTEX_VIEWS = ["dashboard","onboarding","train","study","circuit","progress","leaderboards","profile","settings"];
</script>
<script src="content.js"></script>
<script src="store.js"></script>
<script src="spacing.js"></script>
<script src="engine.js"></script>
<script src="import.js"></script>
<script src="ui/themes.js"></script>
<script src="ui/motion.js"></script>
<script src="drills.js"></script>
<script src="drills-extra.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
