<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralbase</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="focus.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script type="importmap">
{ "imports": { "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" } }
</script>
</head>
<body>

<header class="topbar">
  <a class="mark" href="index.html" aria-label="Neuralbase home">
    <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
      <rect x="8" y="8" width="8" height="8"/><rect x="8" y="18" width="8" height="8"/><rect x="8" y="28" width="8" height="8"/><rect x="8" y="38" width="8" height="8"/><rect x="8" y="48" width="8" height="8"/>
      <rect x="48" y="8" width="8" height="8"/><rect x="48" y="18" width="8" height="8"/><rect x="48" y="28" width="8" height="8"/><rect x="48" y="38" width="8" height="8"/><rect x="48" y="48" width="8" height="8"/>
      <rect x="18" y="18" width="8" height="8"/><rect x="28" y="28" width="8" height="8"/><rect x="38" y="38" width="8" height="8"/>
    </svg>
  </a>
  <nav class="topnav" aria-label="Views">
    <a href="#train" data-view="train" aria-current="page">Drills</a>
    <a href="#stats" data-view="stats">Stats</a>
  </nav>
  <div class="topbar-right">
    <span class="account" id="accountName">Account</span>
    <button class="signout" id="signOutBtn" type="button">Sign out</button>
  </div>
</header>

<main>
  <div class="demo-banner" id="demoBanner" hidden>Demo mode. Progress stays on this device.</div>

  <div class="content" id="view-root">
    <section class="view" id="view-train" tabindex="-1" aria-label="Drills" hidden></section>
    <section class="view" id="view-stats" tabindex="-1" aria-label="Stats" hidden></section>
  </div>
</main>

<div class="sr" id="live" aria-live="polite"></div>

<!-- Boot and view-change loader. Cells light in sequence; a static frame under reduced motion. -->
<div class="nb-loader" id="nbLoader" aria-hidden="true">
  <svg viewBox="0 0 64 64" fill="currentColor">
    <rect class="nb-c" style="--i:0" x="7" y="7" width="8" height="8"/>
    <rect class="nb-c" style="--i:1" x="47" y="7" width="8" height="8"/>
    <rect class="nb-c" style="--i:2" x="7" y="17" width="8" height="8"/>
    <rect class="nb-c" style="--i:3" x="17" y="17" width="8" height="8"/>
    <rect class="nb-c" style="--i:4" x="47" y="17" width="8" height="8"/>
    <rect class="nb-c" style="--i:5" x="7" y="27" width="8" height="8"/>
    <rect class="nb-c" style="--i:6" x="27" y="27" width="8" height="8"/>
    <rect class="nb-c" style="--i:7" x="47" y="27" width="8" height="8"/>
    <rect class="nb-c" style="--i:8" x="7" y="37" width="8" height="8"/>
    <rect class="nb-c" style="--i:9" x="37" y="37" width="8" height="8"/>
    <rect class="nb-c" style="--i:10" x="47" y="37" width="8" height="8"/>
    <rect class="nb-c" style="--i:11" x="7" y="47" width="8" height="8"/>
    <rect class="nb-c" style="--i:12" x="47" y="47" width="8" height="8"/>
  </svg>
</div>
<script>
  /* Failsafe: if the app modules never boot, never leave the loader covering the shell. */
  setTimeout(function () {
    var l = document.getElementById('nbLoader');
    if (l && !l.hidden) l.hidden = true;
  }, 5000);
</script>

<script>
  /* View modules that exist in app/views/. The router imports only names listed here. */
  window.CORTEX_VIEWS = ["train", "stats"];
</script>
<script src="content.js"></script>
<script src="store.js"></script>
<script src="spacing.js"></script>
<script src="engine.js"></script>
<script src="ui/themes.js"></script>
<script src="ui/motion.js"></script>
<script src="drills.js"></script>
<script src="drills-extra.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
