<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neuralbase">
  <!-- Bare grid N, no plate behind it. The lime reads well on a dark tab bar but
       nearly vanishes on a light one, so it swaps to the darker green that the
       porcelain theme already uses. Native media query, no extra file. -->
  <style>
    g { fill: #B6E24A }
    @media (prefers-color-scheme: light) { g { fill: #3F6B00 } }
  </style>
  <g>
    <rect x="7" y="7" width="8" height="8"/><rect x="7" y="17" width="8" height="8"/><rect x="7" y="27" width="8" height="8"/><rect x="7" y="37" width="8" height="8"/><rect x="7" y="47" width="8" height="8"/>
    <rect x="47" y="7" width="8" height="8"/><rect x="47" y="17" width="8" height="8"/><rect x="47" y="27" width="8" height="8"/><rect x="47" y="37" width="8" height="8"/><rect x="47" y="47" width="8" height="8"/>
    <rect x="17" y="17" width="8" height="8"/><rect x="27" y="27" width="8" height="8"/><rect x="37" y="37" width="8" height="8"/>
  </g>
</svg>
