<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralbase - marks 11 to 20</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .lg-wrap{max-width:1080px;margin:0 auto;padding:30px 20px 44px}
  .lg-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .lg-title{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em}
  .lg-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .lg-sub{margin:0 0 22px;color:var(--muted);font-size:13px}

  .lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .lg{
    position:relative;min-width:0;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 12px 13px;display:flex;flex-direction:column;gap:10px;
    transition:border-color .18s ease,transform .18s ease;
  }
  .lg:hover{border-color:var(--accent-edge);transform:translateY(-2px)}
  .lg-n{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim)}
  .lg-mark{height:92px;display:grid;place-items:center;color:var(--accent)}
  .lg-mark svg{width:84px;height:84px;display:block;overflow:visible}
  .lg-cap{font-size:12.5px;line-height:1.35;color:var(--muted)}
</style>
</head>
<body>
<div class="lg-wrap">
  <div class="lg-head">
    <h1 class="lg-title">Neuralbase</h1>
    <span class="lg-eyebrow">Neural / Synapse family</span>
  </div>
  <p class="lg-sub">Marks 11 to 20, monochrome and drawn in the accent token.</p>

  <div class="lg-grid">

    <!-- 11 single neuron with dendrites -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">11</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.4 21.4C17 18 14.2 14 12.6 9.2"/>
          <path d="M15.4 14.6 10.4 13.4"/>
          <path d="M26.6 21.4C31 18 33.8 14 35.4 9.2"/>
          <path d="M32.6 14.6 37.6 13.4"/>
          <path d="M19.2 24C14.4 24 10.6 24 6 24"/>
          <path d="M12 24 12 19.6"/>
          <path d="M28.8 24C33.6 24 37.4 25 42 26.2"/>
          <path d="M36 25.2 36 30"/>
          <path d="M21 27C17.2 31 15.4 35 14.4 40"/>
          <path d="M17.4 33.2 12.4 33.2"/>
          <path d="M27 27C30.8 31 32.6 34.4 33.6 39.4"/>
          <path d="M30.6 32.6 35.6 33"/>
          <circle cx="24" cy="24" r="4.8" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <figcaption class="lg-cap">Single neuron with dendrites</figcaption>
    </figure>

    <!-- 12 node with radiating edges -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">12</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
          <path d="M30 24 39 24"/><path d="M27 29.2 31.5 37"/>
          <path d="M21 29.2 16.5 37"/><path d="M18 24 9 24"/>
          <path d="M21 18.8 16.5 11"/><path d="M27 18.8 31.5 11"/>
          <circle cx="24" cy="24" r="3.5"/>
          <g fill="currentColor" stroke="none">
            <circle cx="40.6" cy="24" r="1.9"/><circle cx="32" cy="38.2" r="1.9"/>
            <circle cx="16" cy="38.2" r="1.9"/><circle cx="7.4" cy="24" r="1.9"/>
            <circle cx="16" cy="9.8" r="1.9"/><circle cx="32" cy="9.8" r="1.9"/>
            <circle cx="24" cy="24" r="1.8"/>
          </g>
        </svg>
      </div>
      <figcaption class="lg-cap">Node with radiating edges</figcaption>
    </figure>

    <!-- 13 two nodes and a synapse gap -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">13</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round">
          <path d="M14.5 24 21 24"/>
          <path d="M27 24 33.5 24"/>
          <g fill="currentColor" stroke="none">
            <circle cx="10" cy="24" r="4.6"/>
            <circle cx="38" cy="24" r="4.6"/>
            <circle cx="22.4" cy="22.4" r=".95"/>
            <circle cx="24" cy="25.6" r=".95"/>
            <circle cx="25.6" cy="22.4" r=".95"/>
          </g>
        </svg>
      </div>
      <figcaption class="lg-cap">Two nodes and a synapse gap</figcaption>
    </figure>

    <!-- 14 dendrite tree -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">14</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 43 24 32"/>
          <path d="M24 32 16 23"/><path d="M24 32 32 23"/>
          <path d="M16 23 10 14"/><path d="M16 23 21 13.5"/>
          <path d="M32 23 38 14"/><path d="M32 23 27 13.5"/>
          <path d="M10 14 7 8"/><path d="M21 13.5 21 7.5"/>
          <path d="M38 14 41 8"/><path d="M27 13.5 27 7.5"/>
        </svg>
      </div>
      <figcaption class="lg-cap">Dendrite tree</figcaption>
    </figure>

    <!-- 15 axon pulse -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">15</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round">
          <path d="M4 24 44 24"/>
          <g fill="currentColor" stroke="none">
            <circle cx="8" cy="24" r="2"/><circle cx="14" cy="24" r="3"/>
            <circle cx="20" cy="24" r="4.4"/><circle cx="26" cy="24" r="4.4"/>
            <circle cx="32" cy="24" r="3"/><circle cx="38" cy="24" r="2"/>
          </g>
        </svg>
      </div>
      <figcaption class="lg-cap">Axon pulse</figcaption>
    </figure>

    <!-- 16 three-node network -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">16</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <path d="M24 11 11 37"/><path d="M24 11 37 37"/><path d="M11 37 37 37"/>
          <g fill="currentColor" stroke="none">
            <circle cx="24" cy="11" r="4.4"/>
            <circle cx="11" cy="37" r="4.4"/>
            <circle cx="37" cy="37" r="4.4"/>
          </g>
        </svg>
      </div>
      <figcaption class="lg-cap">Three-node network</figcaption>
    </figure>

    <!-- 17 synapse as a fork -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">17</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 45 22 30"/>
          <path d="M22 30 12 14"/>
          <path d="M22 30 34 19"/>
          <path d="M17.5 21 11 20"/>
          <g fill="currentColor" stroke="none">
            <circle cx="12" cy="12" r="3.4"/>
            <circle cx="34.6" cy="17.4" r="2.7"/>
          </g>
        </svg>
      </div>
      <figcaption class="lg-cap">Synapse as a fork</figcaption>
    </figure>

    <!-- 18 neural constellation -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">18</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1" stroke-linecap="round" opacity=".9">
          <path d="M8 34 18 12"/><path d="M18 12 26 20"/><path d="M26 20 34 8"/>
          <path d="M26 20 40 30"/><path d="M26 20 14 26"/><path d="M40 30 28 40"/>
          <path d="M34 8 42 14"/><path d="M8 34 14 26"/>
          <g fill="currentColor" stroke="none">
            <circle cx="8" cy="34" r="2"/><circle cx="18" cy="12" r="1.6"/>
            <circle cx="26" cy="20" r="2.6"/><circle cx="34" cy="8" r="1.4"/>
            <circle cx="40" cy="30" r="2"/><circle cx="28" cy="40" r="1.8"/>
            <circle cx="14" cy="26" r="1.4"/><circle cx="42" cy="14" r="1.4"/>
          </g>
        </svg>
      </div>
      <figcaption class="lg-cap">Neural constellation</figcaption>
    </figure>

    <!-- 19 soma with a long tail -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">19</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="14" r="6.5"/>
          <path d="M19 17C28 21 31 31 43 37"/>
          <path d="M30 26.5 36 22.5"/>
          <path d="M43 37 46.5 33.5"/><path d="M43 37 45.5 40.5"/>
          <circle cx="13" cy="14" r="1.7" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <figcaption class="lg-cap">Soma with a long tail</figcaption>
    </figure>

    <!-- 20 action-potential spike -->
    <figure class="lg" style="margin:0">
      <span class="lg-n">20</span>
      <div class="lg-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4,30 16,30 20,28.5 23,8 27,40 31,34 34,30 44,30"/>
        </svg>
      </div>
      <figcaption class="lg-cap">Action-potential spike</figcaption>
    </figure>

  </div>
</div>
</body>
</html>
