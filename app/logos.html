<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralbase logos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0}
.lg-wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
.lg-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.lg-h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.lg-sub{margin:0;color:var(--muted);font-size:13.5px}
.lg-sec{margin-top:30px}
.lg-sec h2{margin:0 0 4px;font-size:14px;font-weight:600}
.lg-sec p{margin:0 0 12px;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.lg-frame{width:100%;height:820px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:block}
@media (max-width:560px){.lg-frame{height:1100px}}
</style>
</head>
<body>
<div class="lg-wrap">
  <div class="lg-head">
    <h1 class="lg-h1">Neuralbase logos</h1>
    <p class="lg-sub">50 marks in five families. Tell me the numbers you like.</p>
  </div>

  <section class="lg-sec">
    <h2>1 to 10</h2>
    <p>Monograms and letterforms</p>
    <iframe class="lg-frame" src="logos-1.html" title="Logos 1 to 10" loading="lazy"></iframe>
  </section>

  <section class="lg-sec">
    <h2>11 to 20</h2>
    <p>Neuron and synapse motifs</p>
    <iframe class="lg-frame" src="logos-2.html" title="Logos 11 to 20" loading="lazy"></iframe>
  </section>

  <section class="lg-sec">
    <h2>21 to 30</h2>
    <p>Geometric and grid</p>
    <iframe class="lg-frame" src="logos-3.html" title="Logos 21 to 30" loading="lazy"></iframe>
  </section>

  <section class="lg-sec">
    <h2>31 to 40</h2>
    <p>Dynamic and signal</p>
    <iframe class="lg-frame" src="logos-4.html" title="Logos 31 to 40" loading="lazy"></iframe>
  </section>

  <section class="lg-sec">
    <h2>41 to 50</h2>
    <p>Wordmark lockups</p>
    <iframe class="lg-frame" src="logos-5.html" title="Logos 41 to 50" loading="lazy"></iframe>
  </section>
</div>
</body>
</html>
