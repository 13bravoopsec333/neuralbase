<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralbase wordmark and lockup set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  /* ---------- Wordmark sheet (set 05, marks 41-50) ---------- */
  .sheet-wrap{max-width:1180px;margin:0 auto;padding:30px 20px 64px}

  .sheet-head{border-bottom:1px solid var(--line);padding-bottom:18px}
  .eyebrow{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--lime)}
  .sheet-head h1{margin:10px 0 6px;font-size:clamp(26px,4vw,40px);font-weight:600;
    letter-spacing:-.03em;line-height:1}
  .sheet-sub{margin:0;color:var(--muted);font-size:13.5px}

  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
    gap:14px;margin-top:22px;align-content:start}

  .tile{margin:0;position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:20px 16px 14px;display:flex;flex-direction:column;
    gap:12px;color:var(--ink);transition:border-color .15s ease}
  .tile:hover{border-color:var(--line2)}
  .tile--accent{color:var(--lime)}

  .idx{position:absolute;top:11px;left:12px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.12em;color:var(--dim)}

  /* Fixed-height stage keeps every tile the same size. */
  .stage{height:134px;width:100%;display:flex;align-items:center;justify-content:center}
  .stage-col{flex-direction:column;gap:11px}
  .stage-row{flex-direction:row;gap:12px}
  .start{align-items:flex-start}

  .glyph{display:block;flex:none}
  .glyph-inline{width:.72em;height:.72em;vertical-align:-.05em;margin:0 .015em;display:inline-block}

  .lock-word{font-family:var(--sans);font-weight:600;font-size:clamp(24px,6.4vw,32px);
    line-height:1;letter-spacing:-.028em;white-space:nowrap}
  .lock-word.sm{font-size:clamp(20px,5.2vw,25px)}

  .lock-two{font-family:var(--sans);font-weight:600;font-size:clamp(24px,6vw,31px);
    line-height:0.9;letter-spacing:-.012em;text-transform:uppercase}

  .lock-init{display:inline-flex;align-items:baseline;gap:.07em;font-family:var(--sans)}
  .lock-init .init{font-weight:600;font-size:clamp(38px,9vw,48px);line-height:1;letter-spacing:-.05em}
  .lock-init .rest{font-weight:500;font-size:clamp(15px,4vw,19px);letter-spacing:-.005em}

  .lock-weight{font-family:var(--sans);font-size:clamp(24px,6.4vw,32px);line-height:1;
    letter-spacing:-.028em;white-space:nowrap}
  .lock-weight .heavy{font-weight:700}
  .lock-weight .light{font-weight:400}

  .lock-plate{font-family:var(--sans);font-weight:600;font-size:clamp(17px,4.4vw,21px);
    line-height:1;letter-spacing:-.012em;padding:14px 20px;border:1px solid currentColor;
    border-radius:14px;display:inline-flex;align-items:center;white-space:nowrap}

  .badge{display:block;width:124px;height:124px}
  .badge-txt{font-family:var(--mono);font-size:10.5px;letter-spacing:1.9px;fill:currentColor}

  .rule-row{display:flex;align-items:center;gap:12px;width:100%}
  .rule-line{flex:1;height:1px;background:currentColor;opacity:.5;min-width:22px}

  .micro{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}

  .cap{margin:0;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);
    padding-top:10px}

  @media (max-width:560px){
    .sheet-wrap{padding:22px 14px 52px}
    .sheet{grid-template-columns:1fr;gap:12px}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="nb-node" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="1.7">
      <line x1="16" y1="16" x2="16" y2="4.8"/>
      <line x1="16" y1="16" x2="5.6" y2="25"/>
      <line x1="16" y1="16" x2="26.4" y2="25"/>
    </g>
    <circle cx="16" cy="16" r="4.4" fill="currentColor"/>
    <circle cx="16" cy="4.8" r="2.6" fill="currentColor"/>
    <circle cx="5.6" cy="25" r="2.6" fill="currentColor"/>
    <circle cx="26.4" cy="25" r="2.6" fill="currentColor"/>
  </symbol>
</svg>

<main class="sheet-wrap">
  <header class="sheet-head">
    <p class="eyebrow">Neuralbase / identity</p>
    <h1>Wordmark and lockup</h1>
    <p class="sheet-sub">Set 05, marks 41 to 50. Monochrome treatments of the name.</p>
  </header>

  <div class="sheet">

    <!-- 41 -->
    <figure class="tile">
      <span class="idx">41</span>
      <div class="stage">
        <span class="lock-word">Neuralbase</span>
      </div>
      <figcaption class="cap">Plain wordmark</figcaption>
    </figure>

    <!-- 42 -->
    <figure class="tile">
      <span class="idx">42</span>
      <div class="stage stage-col">
        <svg class="glyph" width="34" height="34" aria-hidden="true"><use href="#nb-node"/></svg>
        <span class="lock-word sm">Neuralbase</span>
      </div>
      <figcaption class="cap">Mark stacked above</figcaption>
    </figure>

    <!-- 43 -->
    <figure class="tile">
      <span class="idx">43</span>
      <div class="stage stage-row">
        <svg class="glyph" width="30" height="30" aria-hidden="true"><use href="#nb-node"/></svg>
        <span class="lock-word sm">Neuralbase</span>
      </div>
      <figcaption class="cap">Mark to the left</figcaption>
    </figure>

    <!-- 44 -->
    <figure class="tile tile--accent">
      <span class="idx">44</span>
      <div class="stage">
        <span class="lock-word">Neur<svg class="glyph-inline" viewBox="0 0 32 32" aria-hidden="true"><use href="#nb-node"/></svg>lbase</span>
      </div>
      <figcaption class="cap">Node for the letter A</figcaption>
    </figure>

    <!-- 45 -->
    <figure class="tile">
      <span class="idx">45</span>
      <div class="stage">
        <svg class="badge" viewBox="0 0 132 132" role="img" aria-label="Neuralbase">
          <defs><path id="nb-arc" d="M16 66a50 50 0 0 1 100 0"/></defs>
          <circle cx="66" cy="66" r="61" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1"/>
          <text class="badge-txt"><textPath href="#nb-arc" startOffset="50%" text-anchor="middle">NEURALBASE</textPath></text>
          <use href="#nb-node" x="48" y="54" width="36" height="36"/>
        </svg>
      </div>
      <figcaption class="cap">Circular badge</figcaption>
    </figure>

    <!-- 46 -->
    <figure class="tile">
      <span class="idx">46</span>
      <div class="stage stage-col start">
        <div class="rule-row">
          <span class="lock-word sm">Neuralbase</span>
          <span class="rule-line"></span>
        </div>
        <p class="micro">Cognitive training</p>
      </div>
      <figcaption class="cap">Wordmark with rule</figcaption>
    </figure>

    <!-- 47 -->
    <figure class="tile tile--accent">
      <span class="idx">47</span>
      <div class="stage">
        <span class="lock-init"><span class="init">N</span><span class="rest">euralbase</span></span>
      </div>
      <figcaption class="cap">Oversized initial</figcaption>
    </figure>

    <!-- 48 -->
    <figure class="tile">
      <span class="idx">48</span>
      <div class="stage">
        <span class="lock-weight"><span class="heavy">Neural</span><span class="light">base</span></span>
      </div>
      <figcaption class="cap">Weight contrast</figcaption>
    </figure>

    <!-- 49 -->
    <figure class="tile">
      <span class="idx">49</span>
      <div class="stage">
        <span class="lock-plate">Neuralbase</span>
      </div>
      <figcaption class="cap">Rounded plate</figcaption>
    </figure>

    <!-- 50 -->
    <figure class="tile tile--accent">
      <span class="idx">50</span>
      <div class="stage stage-col start">
        <span class="lock-two">Neural</span>
        <span class="lock-two">Base</span>
      </div>
      <figcaption class="cap">Two-line stack</figcaption>
    </figure>

  </div>
</main>

</body>
</html>
