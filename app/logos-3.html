<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralbase marks 21 to 30</title>
<link rel="stylesheet" href="styles.css">
<style>
  .lg-wrap{max-width:1000px;margin:0 auto;padding:30px 20px 54px}
  .lg-head{display:flex;flex-direction:column;gap:5px;margin-bottom:22px}
  .lg-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
  .lg-head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em}
  .lg-head p{margin:0;color:var(--muted);font-size:13px}

  .lg-grid{
    list-style:none;margin:0;padding:0;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;
  }
  .lg-tile{
    --tile-bg:var(--panel);
    background:var(--tile-bg);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 16px 13px;display:flex;flex-direction:column;gap:13px;align-items:center;
    transition:border-color .15s ease,background .15s ease;
  }
  .lg-tile:hover{--tile-bg:var(--panel2);border-color:var(--line2)}
  .lg-mark{
    width:100%;max-width:132px;aspect-ratio:1;color:var(--accent);
    display:grid;place-items:center;
  }
  .lg-mark svg{width:100%;height:100%;display:block;overflow:visible}
  .lg-cap{
    width:100%;display:flex;align-items:baseline;gap:9px;
    padding-top:11px;border-top:1px solid var(--line);
  }
  .lg-num{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--lime)}
  .lg-name{font-size:12.5px;color:var(--muted);line-height:1.3}

  @media (max-width:560px){
    .lg-wrap{padding:22px 14px 40px}
    .lg-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
    .lg-tile{padding:14px 14px 11px}
  }
</style>
</head>
<body>
<div class="lg-wrap">
  <header class="lg-head">
    <span class="lg-eyebrow">Neuralbase identity</span>
    <h1>Geometric and grid marks</h1>
    <p>Ten marks, catalog numbers 21 to 30.</p>
  </header>

  <ol class="lg-grid">

    <!-- 21 dot lattice -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="currentColor">
          <g>
            <circle cx="27" cy="27" r="6"/><circle cx="49" cy="27" r="6"/><circle cx="71" cy="27" r="6"/><circle cx="93" cy="27" r="6"/>
            <circle cx="27" cy="49" r="6"/><circle cx="49" cy="49" r="6"/><circle cx="71" cy="49" r="6"/><circle cx="93" cy="49" r="6"/>
            <circle cx="27" cy="71" r="6"/><circle cx="49" cy="71" r="6"/><circle cx="71" cy="71" r="6"/><circle cx="93" cy="71" r="6"/>
            <circle cx="27" cy="93" r="6"/><circle cx="49" cy="93" r="6"/><circle cx="71" cy="93" r="6"/><circle cx="93" cy="93" r="6"/>
          </g>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">21</span><span class="lg-name">Dot lattice</span></div>
    </li>

    <!-- 22 hexagon hub -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
          <polygon points="102,60 81,96.4 39,96.4 18,60 39,23.6 81,23.6"/>
          <g stroke-width="2">
            <line x1="60" y1="60" x2="102" y2="60"/>
            <line x1="60" y1="60" x2="81" y2="96.4"/>
            <line x1="60" y1="60" x2="39" y2="96.4"/>
            <line x1="60" y1="60" x2="18" y2="60"/>
            <line x1="60" y1="60" x2="39" y2="23.6"/>
            <line x1="60" y1="60" x2="81" y2="23.6"/>
          </g>
          <circle cx="60" cy="60" r="9" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">22</span><span class="lg-name">Hexagon hub</span></div>
    </li>

    <!-- 23 grid cell lit -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3.5">
          <g>
            <rect x="15" y="15" width="26" height="26" rx="4"/>
            <rect x="47" y="15" width="26" height="26" rx="4"/>
            <rect x="79" y="15" width="26" height="26" rx="4"/>
            <rect x="15" y="47" width="26" height="26" rx="4"/>
            <rect x="79" y="47" width="26" height="26" rx="4"/>
            <rect x="15" y="79" width="26" height="26" rx="4"/>
            <rect x="47" y="79" width="26" height="26" rx="4"/>
            <rect x="79" y="79" width="26" height="26" rx="4"/>
          </g>
          <rect x="47" y="47" width="26" height="26" rx="4" fill="currentColor"/>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">23</span><span class="lg-name">Grid cell lit</span></div>
    </li>

    <!-- 24 cube of nodes -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
          <polygon points="60,18 96,39 96,81 60,102 24,81 24,39"/>
          <path d="M60 60 L96 39 M60 60 L24 39 M60 60 L60 102"/>
          <g fill="currentColor" stroke="none">
            <circle cx="60" cy="18" r="5.5"/>
            <circle cx="96" cy="39" r="5.5"/>
            <circle cx="96" cy="81" r="5.5"/>
            <circle cx="60" cy="102" r="5.5"/>
            <circle cx="24" cy="81" r="5.5"/>
            <circle cx="24" cy="39" r="5.5"/>
            <circle cx="60" cy="60" r="5.5"/>
          </g>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">24</span><span class="lg-name">Cube of nodes</span></div>
    </li>

    <!-- 25 circuit trace -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
          <polyline points="24,40 68,40 68,84 96,84"/>
          <g fill="currentColor" stroke="none">
            <rect x="16" y="32" width="16" height="16" rx="3"/>
            <rect x="88" y="76" width="16" height="16" rx="3"/>
            <circle cx="68" cy="62" r="6"/>
          </g>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">25</span><span class="lg-name">Circuit trace</span></div>
    </li>

    <!-- 26 nested squares -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
          <rect x="18" y="18" width="84" height="84" rx="5"/>
          <rect x="31" y="31" width="58" height="58" rx="4"/>
          <rect x="44" y="44" width="32" height="32" rx="3"/>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">26</span><span class="lg-name">Nested squares</span></div>
    </li>

    <!-- 27 triangle lattice -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
          <path d="M60 34 L48 54 M60 34 L72 54
                   M48 54 L36 74 M48 54 L60 74 M72 54 L60 74 M72 54 L84 74
                   M36 74 L24 94 M36 74 L48 94 M60 74 L48 94 M60 74 L72 94 M84 74 L72 94 M84 74 L96 94
                   M48 54 L72 54 M36 74 L84 74 M24 94 L96 94"/>
          <g fill="currentColor" stroke="none">
            <circle cx="60" cy="34" r="5"/>
            <circle cx="48" cy="54" r="5"/><circle cx="72" cy="54" r="5"/>
            <circle cx="36" cy="74" r="5"/><circle cx="60" cy="74" r="5"/><circle cx="84" cy="74" r="5"/>
            <circle cx="24" cy="94" r="5"/><circle cx="48" cy="94" r="5"/><circle cx="72" cy="94" r="5"/><circle cx="96" cy="94" r="5"/>
          </g>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">27</span><span class="lg-name">Triangle lattice</span></div>
    </li>

    <!-- 28 diagonal cut -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor">
          <g stroke-width="2.5" stroke-opacity=".45">
            <rect x="20" y="20" width="80" height="80"/>
            <line x1="40" y1="20" x2="40" y2="100"/>
            <line x1="60" y1="20" x2="60" y2="100"/>
            <line x1="80" y1="20" x2="80" y2="100"/>
            <line x1="20" y1="40" x2="100" y2="40"/>
            <line x1="20" y1="60" x2="100" y2="60"/>
            <line x1="20" y1="80" x2="100" y2="80"/>
          </g>
          <line x1="20" y1="100" x2="100" y2="20" stroke-width="6.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">28</span><span class="lg-name">Diagonal cut</span></div>
    </li>

    <!-- 29 ring of dots -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="currentColor">
          <g>
            <circle cx="100" cy="60" r="6"/>
            <circle cx="94.6" cy="80" r="6"/>
            <circle cx="80" cy="94.6" r="6"/>
            <circle cx="60" cy="100" r="6"/>
            <circle cx="40" cy="94.6" r="6"/>
            <circle cx="25.4" cy="80" r="6"/>
            <circle cx="20" cy="60" r="6"/>
            <circle cx="25.4" cy="40" r="6"/>
            <circle cx="40" cy="25.4" r="6"/>
            <circle cx="60" cy="20" r="6"/>
            <circle cx="80" cy="25.4" r="6"/>
            <circle cx="94.6" cy="40" r="6"/>
          </g>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">29</span><span class="lg-name">Ring of dots</span></div>
    </li>

    <!-- 30 plus node -->
    <li class="lg-tile">
      <div class="lg-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round">
          <line x1="24" y1="60" x2="96" y2="60"/>
          <line x1="60" y1="24" x2="60" y2="96"/>
          <circle cx="60" cy="60" r="10" fill="var(--tile-bg)" stroke="none"/>
          <circle cx="60" cy="60" r="4.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="lg-cap"><span class="lg-num">30</span><span class="lg-name">Plus node</span></div>
    </li>

  </ol>
</div>
</body>
</html>
